<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אולטרסאונד בטן בכלב · הדמיה תלת-מימדית | Canine Abdominal Ultrasound 3D</title>
<style>
  :root{
    --bg:#070b16; --panel:rgba(14,21,38,.82); --panel-solid:#0e1526;
    --line:#1d2942; --accent:#34d1bf; --accent2:#6aa6ff; --warn:#ffb454;
    --txt:#e8eef9; --dim:#9fb0cc; --beam:#ffd24a;
    --good:#43d17a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","Assistant",system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas#scene{display:block;width:100%;height:100%}

  /* ===== Top bar ===== */
  #topbar{position:absolute;top:0;left:0;right:0;height:58px;display:flex;
    align-items:center;justify-content:space-between;padding:0 18px;z-index:20;
    background:linear-gradient(180deg,rgba(7,11,22,.95),rgba(7,11,22,0));pointer-events:none}
  #topbar .title{pointer-events:auto}
  #topbar h1{font-size:16px;font-weight:700;letter-spacing:.2px}
  #topbar h1 small{color:var(--dim);font-weight:500;font-size:11.5px;margin-inline-start:8px}
  .toolbtns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  .tbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;
    backdrop-filter:blur(8px);transition:.15s}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn.on{background:var(--accent);color:#04221e;border-color:var(--accent);font-weight:700}

  /* ===== mode switch ===== */
  #modes{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:18;
    display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:30px;padding:4px;backdrop-filter:blur(12px)}
  #modes .mode{font-size:12.5px;padding:6px 14px;border-radius:22px;cursor:pointer;color:var(--dim);transition:.15s}
  #modes .mode.on{background:var(--accent2);color:#04122e;font-weight:700}

  /* ===== Right: explanation window ===== */
  #explain{position:absolute;top:66px;right:14px;width:362px;max-height:calc(100% - 396px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;z-index:15;backdrop-filter:blur(14px);overflow-y:auto;
    box-shadow:0 18px 50px rgba(0,0,0,.45)}
  #explain h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
  #explain .en{color:var(--dim);font-size:12px;font-weight:500;margin-bottom:10px;direction:ltr;text-align:right}
  .pill{display:inline-block;background:rgba(52,209,191,.14);color:var(--accent);
    border:1px solid rgba(52,209,191,.35);border-radius:20px;padding:2px 10px;font-size:11px;margin-bottom:8px}
  .sec{margin:11px 0;padding-top:10px;border-top:1px dashed var(--line)}
  .sec:first-of-type{border-top:none;padding-top:2px}
  .sec h3{font-size:12.5px;color:var(--accent2);margin-bottom:5px;display:flex;gap:6px;align-items:center}
  .sec h3 .ic{font-size:14px}
  .sec p, .sec li{font-size:13px;line-height:1.55;color:var(--txt)}
  .sec ul{padding-inline-start:18px}
  .sec .ennote{display:block;color:var(--dim);font-size:11px;direction:ltr;text-align:right;margin-top:2px}
  .dz{display:inline-block;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);
    color:#ffd0d0;border-radius:7px;padding:3px 8px;font-size:11.5px;margin:3px 3px 0 0;cursor:default}
  .meas{background:rgba(106,166,255,.1);border:1px solid rgba(106,166,255,.28);border-radius:9px;
    padding:8px 10px;font-size:12.5px;line-height:1.6}
  .meas b{color:var(--accent2)}
  /* real-US slot (future) */
  #realUS{margin-top:6px;border:1px dashed var(--line);border-radius:9px;height:0;overflow:hidden;
    transition:.2s;background:#05080f;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:11px;text-align:center}
  #realUS img{width:100%;border-radius:8px;display:block}

  /* level toggle */
  .levels{display:flex;gap:5px;margin:4px 0 8px}
  .lvl{flex:1;text-align:center;font-size:11px;padding:5px 0;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;color:var(--dim);transition:.15s}
  .lvl.on{background:var(--accent2);color:#04122e;border-color:var(--accent2);font-weight:700}

  /* ===== organ menu (left) ===== */
  #organMenu{position:absolute;top:130px;left:14px;width:212px;max-height:calc(100% - 220px);
    overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:8px;z-index:13;backdrop-filter:blur(12px)}
  #organMenu .mh{font-size:11px;color:var(--accent2);margin:2px 4px 8px;font-weight:700}
  #organMenu .oi{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt);
    padding:7px 8px;border-radius:9px;cursor:pointer;transition:.12s;border:1px solid transparent}
  #organMenu .oi:hover{background:var(--line)}
  #organMenu .oi.on{background:rgba(52,209,191,.16);border-color:rgba(52,209,191,.4);color:var(--accent);font-weight:700}
  #organMenu .oi .sw{width:12px;height:12px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
  #organMenu .oi .nm{flex:1}
  #organMenu .oi .nn{font-size:10px;color:var(--dim);background:#0b1326;border-radius:5px;padding:1px 6px}

  /* ===== 2D echo monitor ===== */
  #monitor{position:absolute;bottom:14px;right:14px;width:272px;z-index:15;
    background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;
    padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  #monitor .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  #monitor .mhead span{font-size:11px;color:var(--accent);letter-spacing:1px}
  #monitor .mhead .live{display:flex;align-items:center;gap:5px;color:var(--bad);font-size:10px}
  #monitor .mhead .live i{width:7px;height:7px;border-radius:50%;background:var(--bad);
    display:inline-block;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  #echoCanvas{width:100%;border-radius:8px;background:#000;display:block;border:1px solid #1a2238}
  #realMon{width:100%;border-radius:8px;display:none;border:1px solid #1a2238}
  .ustog{background:#0e1730;border:1px solid var(--line);color:var(--dim);border-radius:7px;
    padding:3px 8px;font-size:11px;cursor:pointer;transition:.12s}
  .ustog:hover{border-color:var(--accent);color:var(--accent)}
  .ustog.on{background:var(--accent);color:#04221e;border-color:var(--accent);font-weight:700}
  #monitor .cap{font-size:10.5px;color:var(--dim);text-align:center;margin-top:5px;direction:ltr}

  /* ===== Bottom step navigator ===== */
  #nav{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:18;
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:40px;padding:8px 12px;backdrop-filter:blur(14px)}
  #nav button{background:none;border:none;color:var(--txt);cursor:pointer;font-size:15px;
    width:38px;height:38px;border-radius:50%;transition:.15s}
  #nav button:hover{background:var(--line)}
  #nav button:disabled{opacity:.3;cursor:default}
  #nav .dots{display:flex;gap:5px;align-items:center}
  #nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:.18s}
  #nav .dot.on{background:var(--accent);transform:scale(1.4)}
  #nav .step-label{font-size:12px;color:var(--dim);min-width:54px;text-align:center}
  #nav .play{background:var(--accent);color:#04221e;font-weight:700;width:auto;padding:0 14px;border-radius:20px;font-size:13px}

  /* ===== probe orientation badge ===== */
  #orient{position:absolute;top:66px;left:14px;width:212px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:11px 12px;z-index:12;backdrop-filter:blur(10px)}
  #orient h4{font-size:12px;color:var(--accent2);margin-bottom:6px}
  #orient .o{font-size:11.5px;color:var(--txt);line-height:1.5;margin:2px 0}
  #orient .o b{color:var(--warn)}

  /* ===== Quiz ===== */
  #quiz{position:absolute;inset:0;background:rgba(5,8,16,.92);z-index:40;display:none;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
  #quiz .card{width:min(640px,94vw);max-height:90vh;overflow-y:auto;background:var(--panel-solid);
    border:1px solid var(--line);border-radius:20px;padding:26px}
  #quiz h2{font-size:22px;margin-bottom:4px}
  #quiz .qsub{color:var(--dim);font-size:13px;margin-bottom:18px}
  #quiz .q{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b1224}
  #quiz .q .qt{font-size:14px;font-weight:600;margin-bottom:10px}
  #quiz .opt{display:block;width:100%;text-align:right;background:#0e1730;border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:13px;transition:.12s}
  #quiz .opt:hover{border-color:var(--accent2)}
  #quiz .opt.correct{background:rgba(67,209,122,.18);border-color:var(--good)}
  #quiz .opt.wrong{background:rgba(255,107,107,.16);border-color:var(--bad)}
  #quiz .feedback{font-size:12px;margin-top:8px;color:var(--dim);display:none}
  #quiz .score{font-size:16px;text-align:center;margin-top:16px;padding:14px;border-radius:12px;
    background:rgba(52,209,191,.1);border:1px solid rgba(52,209,191,.3)}
  #quiz .close{margin-top:16px;width:100%;background:var(--accent);color:#04221e;border:none;
    border-radius:11px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}

  /* loading */
  #load{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #load .ring{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #load p{color:var(--dim);font-size:13px}

  #ctCredit{position:absolute;left:14px;bottom:14px;z-index:14;display:none;
    font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px 9px;backdrop-filter:blur(8px)}
  #ctCredit a{color:var(--accent2);text-decoration:none}
  @media(max-width:980px){
    #explain{width:300px;font-size:12px}
    #monitor{width:230px}
    #organMenu,#orient{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div id="topbar">
    <div class="title">
      <h1>אולטרסאונד בטן בכלב <small>Canine Abdominal Ultrasound · 3D Trainer</small></h1>
    </div>
    <div class="toolbtns">
      <button class="tbtn on" id="btnBeam">📡 קרן</button>
      <button class="tbtn" id="btnXray">🦴 שלד</button>
      <button class="tbtn on" id="btnPosture">🐕 שכיבה על הגב</button>
      <button class="tbtn" id="btnGhost">👁️ כל האיברים</button>
      <button class="tbtn" id="btnCT">🩻 CT אמיתי</button>
      <button class="tbtn" id="btnQuiz">🎓 חזור על הבדיקה</button>
    </div>
  </div>

  <div id="modes">
    <div class="mode on" data-mode="full">🔄 בדיקה מלאה</div>
    <div class="mode" data-mode="single">🎯 תרגול אבר</div>
    <div class="mode" data-mode="demo">▶ הדגמה</div>
  </div>

  <div id="orient">
    <h4>מנח המתמר · Probe</h4>
    <div class="o" id="oPos"></div>
    <div class="o" id="oMark"></div>
    <div class="o" id="oPlane"></div>
  </div>

  <div id="organMenu"><div class="mh">בחר איבר · Organs</div></div>

  <div id="explain"><!-- filled by JS --></div>

  <div id="monitor">
    <div class="mhead">
      <span id="mTitle">2D US</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="usToggle" class="ustog">📷 אמיתי</button>
        <span class="live"><i></i>LIVE</span>
      </div>
    </div>
    <canvas id="echoCanvas" width="280" height="220"></canvas>
    <img id="realMon" alt="" />
    <div class="cap" id="echoCap"></div>
  </div>

  <div id="nav">
    <button id="prev" title="הקודם">‹</button>
    <div class="dots" id="dots"></div>
    <span class="step-label" id="stepLabel"></span>
    <button id="next" title="הבא">›</button>
    <button class="play" id="autoPlay">▶ הדגמה</button>
  </div>

  <div id="quiz"><div class="card" id="quizCard"></div></div>

  <div id="load"><div class="ring"></div><p>טוען מודל תלת-מימדי…</p></div>
  <div id="ctCredit">מודל CT: <a href="https://sketchfab.com/3d-models/3d-canine-anatomy-normal-abdomen-962de878d2e94b75b10075931f0edaa3" target="_blank" rel="noopener">3D Canine Anatomy © Pixelbeaker</a> · CC-BY</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =========================================================
   1. SCENE
   ========================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070b16, 0.016);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(4.5, 4.0, 12.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 4; controls.maxDistance = 24;
controls.target.set(-1.6, -0.4, 0);

// lights
scene.add(new THREE.HemisphereLight(0x9fc6ff, 0x101826, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x6aa6ff, 0.9); rim.position.set(-8,3,-6); scene.add(rim);
const fill = new THREE.PointLight(0x34d1bf, 0.5, 30); fill.position.set(0,2,6); scene.add(fill);

// ground glow
const grd = new THREE.Mesh(
  new THREE.CircleGeometry(18,64),
  new THREE.MeshBasicMaterial({color:0x0a1120, transparent:true, opacity:.55})
);
grd.rotation.x = -Math.PI/2; grd.position.y = -4.7; scene.add(grd);
const grid = new THREE.GridHelper(34, 34, 0x16223c, 0x0e1626);
grid.position.y = -4.69; scene.add(grid);

/* =========================================================
   2. DOG BODY (transparent) + SKELETON
   Axes:  +X = cranial(front), -X = caudal(rear)
          +Z = left side,      -Z = right side
          +Y = dorsal(up),     -Y = ventral(belly)
   The abdomen occupies roughly  X = +0.6 (diaphragm) → -5.2 (pelvis)
   Dorsal recumbency: probe approaches the belly from ventral (-Y).
   ========================================================= */
const dog = new THREE.Group(); scene.add(dog);

// deterministic organic noise
function pnoise(x,y,z){
  return (Math.sin(x*3.1+y*1.7)+Math.sin(y*2.3+z*2.9)+Math.sin(z*3.7+x*1.3))/3;
}
function warp(geo, amp=0.05, freq=1.6, sx=1, sy=1, sz=1){
  const pos=geo.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i); v.x*=sx; v.y*=sy; v.z*=sz;
    const r=v.length()||1e-4, n=pnoise(v.x*freq,v.y*freq,v.z*freq)*amp;
    v.x+=(v.x/r)*n; v.y+=(v.y/r)*n; v.z+=(v.z/r)*n;
    pos.setXYZ(i,v.x,v.y,v.z);
  }
  geo.computeVertexNormals(); return geo;
}

// translucent whole-dog silhouette
const bodyGroup = new THREE.Group(); dog.add(bodyGroup);
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0x9cc0ef, transparent:true, opacity:.06, roughness:.2, metalness:0,
  transmission:.95, thickness:.8, ior:1.2, side:THREE.DoubleSide, depthWrite:false,
  clearcoat:.3, clearcoatRoughness:.5
});
const outlineMat = new THREE.MeshBasicMaterial({color:0x6fa0e0, wireframe:true, transparent:true, opacity:.05, depthWrite:false});
function glass(geo, x,y,z, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(geo, glassMat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.scale.set(sx,sy,sz);
  bodyGroup.add(m);
  const w=new THREE.Mesh(geo, outlineMat);
  w.position.set(x,y,z); w.rotation.set(rx,ry,rz); w.scale.set(sx,sy,sz);
  bodyGroup.add(w); return m;
}
// chest (cranial) — heart/lungs live here, not the focus
glass(new THREE.CapsuleGeometry(2.7, 2.2, 16, 28), 0.9,-0.1,0,  0,0,Math.PI/2,  1,1,0.92);
// abdomen — the main working volume, fuller caudally
glass(new THREE.SphereGeometry(2.75,30,24), -2.6,-0.35,0, 0,0,0, 1.55,1.05,1.02);
// pelvis
glass(new THREE.SphereGeometry(1.7,24,18), -5.1,-0.3,0, 0,0,0, 1.0,1.0,0.95);
// neck + head
glass(new THREE.CylinderGeometry(1.35,1.85,2.1,24), 4.2,0.8,0, 0,0,-Math.PI/2.6);
glass(new THREE.SphereGeometry(1.3,28,24), 5.7,1.6,0, 0,0,0, 1.05,0.95,0.9);
glass(new THREE.CapsuleGeometry(0.58,0.85,12,18), 6.95,1.2,0, 0,0,Math.PI/2.2, 1,1,0.9);
// ears
glass(new THREE.ConeGeometry(0.46,1.0,16), 5.6,2.8,0.65, 0.3,0,0.2);
glass(new THREE.ConeGeometry(0.46,1.0,16), 5.6,2.8,-0.65, -0.3,0,0.2);
// legs
glass(new THREE.CapsuleGeometry(0.48,2.9,10,16), 2.7,-3.0,0.95);
glass(new THREE.CapsuleGeometry(0.48,2.9,10,16), 2.7,-3.0,-0.95);
glass(new THREE.CapsuleGeometry(0.55,2.8,10,16), -4.6,-3.0,1.0);
glass(new THREE.CapsuleGeometry(0.55,2.8,10,16), -4.6,-3.0,-1.0);
[[2.7,0.95],[2.7,-0.95],[-4.6,1.0],[-4.6,-1.0]].forEach(p=>
  glass(new THREE.SphereGeometry(0.52,16,12), p[0],-4.5,p[1], 0,0,0, 1.3,0.7,1.1));
// tail
glass(new THREE.CapsuleGeometry(0.38,2.2,10,14), -6.6,0.3,0, 0,0,-Math.PI/3.2, 1,1,1);

// ===== skeleton (ribs + spine + pelvis) toggle =====
const skelGroup = new THREE.Group(); dog.add(skelGroup);
const boneMat = new THREE.MeshStandardMaterial({color:0xdfe4ec, roughness:.6, metalness:.1, transparent:true, opacity:.5});
// caudal rib pairs over the cranial abdomen (liver lies under these)
for(let i=0;i<7;i++){
  const x = 1.9 - i*0.62;
  const r = 2.95 * Math.sqrt(Math.max(0.05, 1-(x/4.6)**2));
  const rib=new THREE.Mesh(new THREE.TorusGeometry(r,.07,8,36,Math.PI*1.2), boneMat);
  rib.position.x=x; rib.rotation.y=Math.PI/2; rib.rotation.z=Math.PI*0.13; skelGroup.add(rib);
}
// spine along the dorsal abdomen
const spine=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,12,12), boneMat);
spine.rotation.z=Math.PI/2; spine.position.set(-1.0,2.45,0); skelGroup.add(spine);
// lumbar transverse processes hint
for(let i=0;i<6;i++){
  const x=-0.4 - i*0.7;
  const tp=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,1.4), boneMat); tp.position.set(x,2.4,0); skelGroup.add(tp);
}
// pelvis ring
const pelvis=new THREE.Mesh(new THREE.TorusGeometry(1.15,.12,10,28), boneMat);
pelvis.position.set(-5.1,0.2,0); pelvis.rotation.y=Math.PI/2; skelGroup.add(pelvis);
skelGroup.visible=false;

// orientation labels (sprites)
function makeLabel(txt, color='#9fb0cc'){
  const c=document.createElement('canvas'); c.width=300;c.height=64;
  const x=c.getContext('2d'); x.font='bold 32px Segoe UI'; x.fillStyle=color;
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,150,32);
  const t=new THREE.CanvasTexture(c);

function flesh(color, rough=.42){
  return new THREE.MeshPhysicalMaterial({
    color:new THREE.Color(color), roughness:rough, metalness:0,
    clearcoat:.5, clearcoatRoughness:.45, sheen:.4, sheenRoughness:.6,

    transparent:true, opacity:.95
  });
}

// ---------- per-organ geometry builders ----------
function buildLiver(g,mat){
  // multi-lobed wedge tucked under the diaphragm
  const lobe=(sx,sy,sz,px,py,pz,ry)=>{
    const m=new THREE.Mesh(warp(new THREE.SphereGeometry(1,28,20),.06,1.4),mat);
    m.scale.set(sx,sy,sz); m.position.set(px,py,pz); m.rotation.y=ry; g.add(m);
  };
  lobe(1.5,0.9,0.7, 0.1,0,0.5, .2);
  lobe(1.4,0.85,0.65, 0.15,-0.15,-0.4, -.2);
  lobe(1.1,0.8,0.6, 0.55,0.1,0.05, 0);
  lobe(1.0,0.7,0.55,-0.35,-0.1,0.15, .3);
  // gallbladder — anechoic sac on the right
  const gbMat=new THREE.MeshPhysicalMaterial({color:0x1c2c3a, roughness:.15, transmission:.85,
    thickness:.6, ior:1.33, transparent:true, opacity:.8, side:THREE.DoubleSide});
  const gb=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,18),gbMat);
  gb.scale.set(.8,1.1,.8); gb.position.set(0.35,-0.5,-0.55); g.add(gb);
  g.userData.extraMats=[gbMat];
}
function buildSpleen(g,mat){
  // long, tongue-shaped, smooth — runs along the left body wall
  const body=new THREE.Mesh(warp(new THREE.CapsuleGeometry(0.5,2.4,14,24),.04,1.2,1,1,.5),mat);
  body.rotation.z=Math.PI/2.4; body.scale.set(1,1,.5); g.add(body);
}
function buildKidney(g,mat){
  // bean shape: sphere scaled + indented hilus
  const k=new THREE.Mesh(warp(new THREE.SphereGeometry(0.9,30,22),.05,1.5),mat);
  k.scale.set(1.4,0.95,0.8); g.add(k);
  // hilus dimple (darker)
  const hil=new THREE.Mesh(new THREE.SphereGeometry(0.42,18,14),
    new THREE.MeshStandardMaterial({color:0x6b1f17,roughness:.5,transparent:true,opacity:.9}));
  hil.position.set(0,0,0.62); hil.scale.set(1.1,.7,.5); g.add(hil);
  g.userData.extraMats=[hil.material];
}
function buildAdrenals(g,mat){
  // two small peanut-shaped glands near midline
  [[0.0,0.0,0.35],[0.0,0.1,-0.35]].forEach((p,i)=>{
    const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.4,8,14),mat);
    a.position.set(p[0],p[1],p[2]); a.rotation.z=Math.PI/2.2; a.scale.set(1,1,.8); g.add(a);

}
function buildStomach(g,mat){
  const s=new THREE.Mesh(warp(new THREE.TorusGeometry(1.0,0.5,16,32,Math.PI*1.3),.05,1.2),mat);
  s.rotation.x=Math.PI/2; s.rotation.z=Math.PI*0.1; s.scale.set(1,1,.7); g.add(s);
}
function buildPancreas(g,mat){

  const r=new THREE.Mesh(warp(new THREE.CapsuleGeometry(0.22,2.0,10,18),.04,1.4),mat);

function buildSI(g,mat){
  // several looping segments through mid-ventral abdomen
  const wallMat=mat;
  const lumMat=new THREE.MeshStandardMaterial({color:0x3a1410,roughness:.6,transparent:true,opacity:.85});
  const loops=[
    [[-1.2,-0.6,0.8],[-0.2,-1.0,0.3],[-1.0,-1.2,-0.5]],
    [[0.4,-0.8,-0.6],[-0.6,-1.3,-0.9],[-1.6,-0.9,-0.4]],
    [[-0.4,-0.5,1.0],[-1.4,-0.4,0.9],[-2.0,-0.9,0.2]],
    [[-1.8,-1.0,-0.2],[-2.4,-0.5,0.5],[-2.0,-1.1,1.0]]
  ];
  loops.forEach(pts=>{
    const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',0.4);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.26,14,false),wallMat));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.12,12,false),lumMat));
  });
  g.userData.extraMats=[lumMat];
}
function buildColon(g,mat){
  // frame: ascending(right)→transverse→descending(left)→pelvis
  const pts=[[ -0.2,-0.2,-1.4],[0.3,0.3,-1.0],[0.4,0.5,0.0],[0.0,0.4,1.2],
             [-1.4,0.2,1.3],[-2.8,0.0,1.1],[-4.2,-0.3,0.6],[-5.0,-0.6,0.0]];
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',0.4);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,90,0.34,16,false),mat));
  // gas shadow hint (bright near wall, dark beyond) handled in 2D monitor
}
function buildLN(g,mat){
  // a cluster of small oval nodes at the mesenteric root
  [[0,0,0],[0.4,0.1,0.3],[-0.3,-0.1,-0.2],[0.1,0.3,-0.3],[-0.2,0.2,0.35]].forEach(p=>{
    const n=new THREE.Mesh(warp(new THREE.SphereGeometry(0.26,18,14),.03,2),mat);
    n.position.set(...p); n.scale.set(1.5,0.7,0.7); g.add(n);
  });
}
function buildBladder(g,mat){
  // anechoic sphere with a thin wall
  const wallMat=new THREE.MeshPhysicalMaterial({color:0x2a4a6a, roughness:.2, transmission:.8,
    thickness:.8, ior:1.33, transparent:true, opacity:.5, side:THREE.DoubleSide});
  const b=new THREE.Mesh(new THREE.SphereGeometry(1.0,32,24),wallMat);
  b.scale.set(1.2,0.95,1); g.add(b);
  // faint inner lumen marker so it reads as filled
  const inner=new THREE.Mesh(new THREE.SphereGeometry(0.9,24,18),
    new THREE.MeshBasicMaterial({color:0x0a1a2a,transparent:true,opacity:.25}));
  inner.scale.set(1.2,0.95,1); g.add(inner);
  g.userData.extraMats=[wallMat]; g.userData.skipFade=[inner.material];
}
function buildProstate(g,mat){
  // bilobed gland around the urethra, just caudal to the bladder neck
  [[0,0,0.28],[0,0,-0.28]].forEach(p=>{
    const l=new THREE.Mesh(warp(new THREE.SphereGeometry(0.5,24,18),.04,1.6),mat);
    l.position.set(...p); l.scale.set(1,0.95,0.9); g.add(l);
  });
}
function buildVessels(g,mat){
  // aorta (left, pulsatile-looking) + caudal vena cava (right) along the dorsal midline
  const ao=new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.0,1.6,0.25),new THREE.Vector3(-1.0,1.5,0.25),
    new THREE.Vector3(-3.0,1.2,0.25),new THREE.Vector3(-4.6,0.6,0.2)]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(ao,64,0.22,18,false),mat));
  const cvcMat=new THREE.MeshPhysicalMaterial({color:0x3656a0,roughness:.4,clearcoat:.4,
    transparent:true,opacity:.95});
  const cvc=new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.0,1.5,-0.25),new THREE.Vector3(-1.0,1.45,-0.25),
    new THREE.Vector3(-3.0,1.1,-0.22),new THREE.Vector3(-4.4,0.6,-0.2)]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(cvc,64,0.24,18,false),cvcMat));
  g.userData.extraMats=[cvcMat];
}

/* ---- build all organ groups + register materials for fading ---- */
const organData = {};   // id -> {group, mats, base:[Color...], pos}
ORGANS.forEach(o=>{
  const g=new THREE.Group(); g.position.set(...o.pos);
  const mat=flesh(o.color);
  o.build(g,mat);
  // collect every material under the group so we can fade the whole organ
  const mats=new Set([mat]);
  if(g.userData.extraMats) g.userData.extraMats.forEach(m=>mats.add(m));
  g.traverse(ch=>{ if(ch.material) mats.add(ch.material); });
  const skip=new Set(g.userData.skipFade||[]);
  const list=[...mats].filter(m=>!skip.has(m));
  organData[o.id]={
    group:g, mats:list,
    base:list.map(m=>({color:m.color.clone(), opacity:m.opacity})),
    pos:new THREE.Vector3(...o.pos)
  };
  organsRoot.add(g);
});

const PALE = new THREE.Color(0x4a5a72);   // washed-out tint for inactive organs
function applyFade(){
  ORGANS.forEach((o,i)=>{
    const d=organData[o.id];
    const active = (i===cur);
    d.mats.forEach((m,j)=>{
      const b=d.base[j];
      const show = active || ghostAll;
      const tgtCol = show ? b.color : b.color.clone().lerp(PALE,0.62);
      const tgtOp  = show ? b.opacity : Math.min(b.opacity,0.3);
      m.color.lerp(tgtCol, 0.18);
      m.opacity += (tgtOp-m.opacity)*0.18;
      if(m.emissive){ m.emissive.lerp(active?new THREE.Color(o.color).multiplyScalar(0.18):new THREE.Color(0x000000),0.15); }
    });
    // active organ gently scales up
    const s=ghostAll?1: (active?1.06:1.0);
    d.group.scale.x += (s-d.group.scale.x)*0.15;
    d.group.scale.y += (s-d.group.scale.y)*0.15;
    d.group.scale.z += (s-d.group.scale.z)*0.15;
  });
}

// BEAM — flat sector (imaging plane) from probe face
const beamGroup = new THREE.Group(); probe.add(beamGroup);
const SECTOR_DEG = 64, SECTOR_LEN = 5.0;
function buildSector(){
  const shape = new THREE.Shape();
  const half = THREE.MathUtils.degToRad(SECTOR_DEG/2);
  shape.moveTo(0,0);
  const seg=24;
  for(let i=0;i<=seg;i++){
    const a = -half + (2*half)*(i/seg);
    shape.lineTo(Math.sin(a)*SECTOR_LEN, -Math.cos(a)*SECTOR_LEN);
  }
  shape.lineTo(0,0);
  return new THREE.ShapeGeometry(shape);
}
const beamMat = new THREE.MeshBasicMaterial({color:0xffd24a, transparent:true, opacity:.15,
  side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending});
const beamMesh = new THREE.Mesh(buildSector(), beamMat);

/* =========================================================
   6. PROBE / CAMERA animation between organs (tweened)
   ========================================================= */
let tween = null;
const probeBase = new THREE.Euler();
function goTo(i){
  cur = (i + ORGANS.length) % ORGANS.length;
  const v = ORGANS[cur];
  const from = {p:probe.position.clone(), r:probe.rotation.clone()};
  // flip the probe so its face/beam point UP into the ventral abdomen (probe approaches from below)
  const to = {p:new THREE.Vector3(...v.probePos),
              r:new THREE.Euler(v.probeRot[0]+Math.PI, v.probeRot[1], v.probeRot[2])};
  probeBase.copy(to.r);
  // frame the organ — use WORLD position so it works in any posture
  const od = organData[v.id].pos;
  const wp = new THREE.Vector3(); organData[v.id].group.getWorldPosition(wp);
  const side = od.z >= 0 ? 1 : -1;
  let camTo, tgtTo;
  if(posture==='dorsal'){
    // dog on its back, belly up — view from front-above, slightly to the side
    camTo = new THREE.Vector3(wp.x*0.4+2.4, 6.0, side*9 + (side>0?2:-2));
    tgtTo = new THREE.Vector3(wp.x, wp.y+0.4, wp.z*0.5);
  } else {
    camTo = new THREE.Vector3(wp.x*0.6+1.5, -2.0, side*13.5 + (side>0?2:-2));
    tgtTo = new THREE.Vector3(wp.x, wp.y-0.2, wp.z*0.4);
  }
  const camFrom = camera.position.clone();
  const tgtFrom = controls.target.clone();
  const t0 = performance.now(), dur=900;
  tween = (now)=>{
    let k = Math.min(1,(now-t0)/dur); k = k<.5? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    probe.position.lerpVectors(from.p, to.p, k);
    probe.rotation.x = from.r.x + (to.r.x-from.r.x)*k;
    probe.rotation.y = from.r.y + (to.r.y-from.r.y)*k;
    probe.rotation.z = from.r.z + (to.r.z-from.r.z)*k;
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
    if(k>=1) tween=null;
  };
  renderExplain();
}

document.getElementById('prev').onclick = ()=>goTo(cur-1);

/* =========================================================
   7. 2D US MONITOR (schematic, animated, sector)
   ========================================================= */
const ec = document.getElementById('echoCanvas');
const ex = ec.getContext('2d');
const EW=300, EH=300; ec.width=EW; ec.height=EH;
// --- sector geometry (apex top-center, fanning down) ---
const APX_X=150, APX_Y=10, SEC_R=286, HALF=THREE.MathUtils.degToRad(33);
const A0=Math.PI/2+HALF, A1=Math.PI/2-HALF;      // canvas angles (y-down) of the two edges
const DEPTH_CM=6, PXCM=SEC_R/DEPTH_CM;            // 6 cm scan depth
function sectorMask(){
  ex.beginPath(); ex.moveTo(APX_X, APX_Y);
  ex.arc(APX_X, APX_Y, SEC_R, A0, A1, true); ex.closePath();
}
// depth(px from apex) -> y ; helper to place by cm
function cmY(cm){ return APX_Y+cm*PXCM; }

// ---- precompute speckle frames (grayscale tissue texture) ----
const NSP=4, speckleFrames=[];
(function buildSpeckle(){
  for(let f=0;f<NSP;f++){
    const c=document.createElement('canvas'); c.width=EW; c.height=EH;
    const cx=c.getContext('2d'); const img=cx.createImageData(EW,EH); const d=img.data;
    for(let i=0;i<d.length;i+=4){
      // correlated-ish noise: mostly mid, occasional bright/dark grain
      let n=128 + (Math.random()-0.5)*150;
      if(Math.random()>0.93) n=200+Math.random()*55;   // bright speckle
      n=Math.max(40,Math.min(235,n));
      d[i]=d[i+1]=d[i+2]=n; d[i+3]=255;
    }
    cx.putImageData(img,0,0); speckleFrames.push(c);
  }
})();

const g=v=>`rgb(${v|0},${v|0},${v|0})`;
function ellipse(cx,cy,rx,ry,fill,rot=0,alpha=1){
  ex.save(); ex.globalAlpha=alpha; ex.translate(cx,cy); ex.rotate(rot);
  ex.beginPath(); ex.ellipse(0,0,rx,ry,0,0,Math.PI*2); ex.fillStyle=fill; ex.fill(); ex.restore();
}
// semi-transparent soft tissue (speckle shows through) — parenchyma
function soft(cx,cy,rx,ry,level,rot=0){ ellipse(cx,cy,rx,ry,g(level),rot,0.8); }
// opaque region
function solid(cx,cy,rx,ry,level,rot=0){ ellipse(cx,cy,rx,ry,g(level),rot,1); }
// anechoic fluid (kills speckle, near-black) + bright far wall
function lumen(cx,cy,rx,ry,rot=0){
  ellipse(cx,cy,rx,ry,g(8),rot,1);
  ex.save(); ex.translate(cx,cy); ex.rotate(rot);
  ex.beginPath(); ex.ellipse(0,0,rx,ry,0,0.25*Math.PI,0.75*Math.PI); // far (bottom) wall bright
  ex.strokeStyle=g(225); ex.lineWidth=2.4; ex.stroke(); ex.restore();
}
function capsule(cx,cy,rx,ry,level=215,rot=0,w=1.6){
  ex.save(); ex.translate(cx,cy); ex.rotate(rot);
  ex.beginPath(); ex.ellipse(0,0,rx,ry,0,0,Math.PI*2); ex.strokeStyle=g(level); ex.lineWidth=w; ex.stroke(); ex.restore();
}
// posterior acoustic SHADOW or ENHANCEMENT — diverges along rays from apex
function column(cxTop,topY,halfTop,kind){
  const scale=(APX_Y+SEC_R-APX_Y)/(topY-APX_Y);
  const xLt=cxTop-halfTop, xRt=cxTop+halfTop, botY=APX_Y+SEC_R;
  const xLb=APX_X+(xLt-APX_X)*scale, xRb=APX_X+(xRt-APX_X)*scale;
  ex.save();
  const grad=ex.createLinearGradient(0,topY,0,botY);
  if(kind==='shadow'){ grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(.25,'rgba(0,0,0,.78)'); grad.addColorStop(1,'rgba(0,0,0,.92)'); }
  else { grad.addColorStop(0,'rgba(255,255,255,0)'); grad.addColorStop(.4,'rgba(220,220,220,.16)'); grad.addColorStop(1,'rgba(230,230,230,.26)'); }
  ex.fillStyle=grad;
  ex.beginPath(); ex.moveTo(xLt,topY); ex.lineTo(xRt,topY); ex.lineTo(xRb,botY); ex.lineTo(xLb,botY); ex.closePath();
  ex.globalCompositeOperation = kind==='shadow'?'source-over':'lighter';
  ex.fill(); ex.restore();
}
function bright(cx,cy,w,h,level=245,rot=0){ ellipse(cx,cy,w,h,g(level),rot,1); }
function lbl(txt,x,y,lx,ly){
  if(lx!==undefined){ ex.strokeStyle='rgba(180,255,210,.6)'; ex.lineWidth=1;
    ex.beginPath(); ex.moveTo(lx,ly); ex.lineTo(x,y); ex.stroke();
    ex.fillStyle='#bdffd6'; ex.beginPath(); ex.arc(lx,ly,1.8,0,7); ex.fill(); }
  ex.fillStyle='#d9ffe9'; ex.font='10px Segoe UI'; ex.textAlign='left'; ex.fillText(txt,x,y);
}

function drawEcho(t){
  const v=ORGANS[cur];
  // background gradient (TGC: brighter mid-field, darker near & far)
  ex.fillStyle='#000'; ex.fillRect(0,0,EW,EH);
  ex.save(); sectorMask(); ex.clip();
  const bg=ex.createLinearGradient(0,APX_Y,0,APX_Y+SEC_R);
  bg.addColorStop(0,'#0a0a0a'); bg.addColorStop(.18,'#1c1c1c'); bg.addColorStop(.55,'#242424'); bg.addColorStop(1,'#0c0c0c');
  ex.fillStyle=bg; ex.fillRect(0,0,EW,EH);
  // tissue speckle base
  ex.save(); ex.globalAlpha=.55; ex.globalCompositeOperation='overlay';
  ex.drawImage(speckleFrames[Math.floor(t*8)%NSP],0,0); ex.restore();

  const cx=APX_X, midY=cmY(2.8);
  switch(v.echo){
    case 'liver':{
      soft(cx,midY+18,150,150,108);                                   // parenchyma
      // hepatic/portal vessels (portal = bright walls)
      ex.strokeStyle=g(30); ex.lineWidth=9; ex.beginPath();
      ex.moveTo(cx-70,midY-8); ex.quadraticCurveTo(cx,midY+8,cx+60,midY+34); ex.stroke();
      ex.strokeStyle=g(210); ex.lineWidth=1.4; ex.beginPath();
      ex.moveTo(cx-70,midY-8); ex.quadraticCurveTo(cx,midY+8,cx+60,midY+34); ex.stroke();
      ex.strokeStyle=g(28); ex.lineWidth=6; ex.beginPath(); ex.moveTo(cx-34,midY+48); ex.lineTo(cx+46,midY-22); ex.stroke();
      // gallbladder — anechoic + posterior enhancement
      lumen(cx+52,midY+8,26,34); column(cx+52,midY+40,22,'enhance');
      // diaphragm bright line (far field)
      ex.strokeStyle=g(215); ex.lineWidth=2; ex.beginPath();
      ex.moveTo(cx-90,cmY(5.2)); ex.quadraticCurveTo(cx,cmY(4.7),cx+90,cmY(5.2)); ex.stroke();
      lbl('Liver',cx-96,midY-30,cx-50,midY); lbl('GB',cx+70,midY-6,cx+52,midY+8);
      lbl('portal v.',cx-104,midY+30,cx-40,midY+6); lbl('diaphragm',cx+30,cmY(5.5),cx,cmY(4.8));
      break;
    }
    case 'spleen':{
      soft(cx,midY,160,66,150);                                       // homogeneous, hyperechoic
      capsule(cx,midY,160,66,225);
      lbl('Spleen — fine, hyperechoic',cx-120,midY-44,cx,midY);
      break;
    }
    case 'kidney':{
      const ang=-0.15;
      capsule(cx,midY,92,66,225,ang,2);                               // renal capsule (bright)
      soft(cx,midY,90,64,118,ang);                                    // cortex
      for(let k=-2;k<=2;k++){ solid(cx+k*30,midY+6,15,26,55,ang); }   // medullary pyramids (hypoechoic)
      solid(cx,midY+2,30,18,190,ang);                                 // renal sinus (bright fat)
      lbl('cortex',cx-118,midY-34,cx-60,midY-18);
      lbl('medulla',cx+60,cmY(4.3),cx+30,midY+12);
      lbl('sinus',cx+70,midY-6,cx,midY+2);
      break;
    }
    case 'adrenal':{
      // great vessel as landmark (anechoic tube, pulsatile)
      const beat=(Math.sin(t*5)+1)/2;
      ex.save(); ex.translate(cx-34,midY); ex.rotate(.16);
      lumen(0,0,16+beat*2,86); ex.restore();
      // peanut-shaped gland (hypoechoic) next to it
      solid(cx+24,midY-14,11,17,70); solid(cx+20,midY+12,10,15,70);
      ex.strokeStyle=g(60); ex.lineWidth=7; ex.beginPath(); ex.moveTo(cx+22,midY-10); ex.lineTo(cx+18,midY+8); ex.stroke();
      lbl('aorta',cx-120,midY-30,cx-34,midY); lbl('adrenal',cx+44,midY,cx+22,midY-2);
      break;
    }
    case 'git':{
      // cross-section: 5 alternating layers ("target")
      const layers=[[52,52],[210,44],[70,38],[205,30],[60,22],[8,14]];
      layers.forEach(([lv,r])=>solid(cx,midY,r,r,lv));
      column(cx,midY+14,9,'shadow'); // central gas
      lbl('5-layer wall',cx-118,midY-46,cx-30,midY-30);
      lbl('mucosa',cx+60,midY+34,cx+18,midY+14);
      break;
    }
    case 'pancreas':{
      // duodenum (layered tube) as landmark
      ex.save(); ex.translate(cx+40,midY); ex.rotate(.25);
      solid(0,0,18,78,70); solid(0,0,9,78,12); ex.restore();
      soft(cx-8,midY,66,20,120,0.05);                                 // lobular pancreas (iso/slightly hyper)
      lbl('pancreas',cx-118,midY-26,cx-20,midY);
      lbl('duodenum',cx+60,cmY(4.6),cx+40,midY+20);
      break;
    }
    case 'colon':{
      // bright curved gas interface + "dirty" posterior shadow
      ex.strokeStyle=g(238); ex.lineWidth=4; ex.beginPath();
      ex.arc(cx,midY+18,58,Math.PI*1.15,Math.PI*1.85,false); ex.stroke();
      column(cx,midY,46,'shadow');
      // dirty (reverberation) streaks within the shadow
      ex.globalAlpha=.25; ex.fillStyle=g(150);
      for(let i=0;i<9;i++) ex.fillRect(cx-58+i*14, midY+30, 2, 120);
      ex.globalAlpha=1;
      lbl('gas interface',cx-120,midY-40,cx,midY-40);
      lbl('dirty shadow',cx+30,cmY(5),cx,midY+70);
      break;
    }
    case 'ln':{
      soft(cx,midY,150,70,120);                                       // mesenteric fat background
      solid(cx,midY,32,15,72); capsule(cx,midY,32,15,150,0,1.2);      // ovoid hypoechoic node
      lbl('jejunal LN (ovoid)',cx-120,midY+40,cx,midY);
      break;
    }
    case 'bladder':{
      lumen(cx,midY+4,92,70);                                         // anechoic urine + bright far wall
      capsule(cx,midY+4,92,70,150,0,1.4);                             // thin wall
      column(cx,cmY(5.2),70,'enhance');                               // posterior enhancement
      // gravity-dependent calculus with clean shadow
      solid(cx+12,midY+52,9,7,245); column(cx+12,midY+58,9,'shadow');
      lbl('urine (anechoic)',cx-120,midY-28,cx,midY);
      lbl('calculus',cx+58,cmY(4.6),cx+12,midY+52);
      lbl('enhancement',cx-30,cmY(5.6),cx,cmY(5.1));
      break;
    }
    case 'prostate':{
      soft(cx-24,midY,30,34,120); soft(cx+24,midY,30,34,120);         // bilobed, symmetric
      capsule(cx-24,midY,30,34,200); capsule(cx+24,midY,30,34,200);
      ex.strokeStyle=g(40); ex.lineWidth=3; ex.beginPath(); ex.moveTo(cx,midY-34); ex.lineTo(cx,midY+34); ex.stroke();
      lbl('prostate — bilobed',cx-120,midY-44,cx,midY);
      break;
    }
    case 'vessels':{
      const resp=(Math.sin(t*1.4)+1)/2, beat=(Math.sin(t*5)+1)/2;
      lumen(cx-30,midY,20+beat*3,20+beat*3); capsule(cx-30,midY,20+beat*3,20+beat*3,200,0,2); // aorta: round, thick wall, pulsatile
      lumen(cx+34,midY,26,9+resp*11); capsule(cx+34,midY,26,9+resp*11,150,0,1.2);              // CVC: ovoid, collapsing
      lbl('aorta (pulsatile)',cx-128,midY-30,cx-30,midY);
      lbl('CVC (collapses)',cx+44,cmY(4.4),cx+34,midY);
      break;
    }
  }
  ex.restore(); // unclip

  // sector outline
  ex.strokeStyle='rgba(120,160,140,.5)'; ex.lineWidth=1; sectorMask(); ex.stroke();
  // depth ruler (right edge, cm ticks)
  ex.strokeStyle='rgba(150,180,160,.5)'; ex.fillStyle='rgba(150,180,160,.7)';
  ex.font='8px monospace'; ex.textAlign='left'; ex.lineWidth=1;
  for(let d=1;d<=DEPTH_CM;d++){ const y=cmY(d);
    ex.beginPath(); ex.moveTo(EW-10,y); ex.lineTo(EW-4,y); ex.stroke(); ex.fillText(d,EW-9,y-2); }
  // focal-zone marker (left, animated within mid field)
  const fz=cmY(2.6+Math.sin(t*0.7)*0.15);
  ex.fillStyle='#ffd24a'; ex.beginPath(); ex.moveTo(7,fz); ex.lineTo(13,fz-4); ex.lineTo(13,fz+4); ex.closePath(); ex.fill();
  // header text (machine-style)
  ex.fillStyle='rgba(180,210,190,.8)'; ex.font='9px monospace'; ex.textAlign='left';
  ex.fillText('C8-5  ABD',6,12);
  ex.textAlign='right'; ex.fillText('D 6.0cm  Gn 58  MI 0.8',EW-4,12);
  // live scan-line sweep
  const sa=(Math.sin(t*2.2))*HALF;
  ex.save(); sectorMask(); ex.clip(); ex.globalAlpha=.12; ex.strokeStyle='#dfffe9'; ex.lineWidth=2;
  ex.beginPath(); ex.moveTo(APX_X,APX_Y);
  ex.lineTo(APX_X+Math.sin(sa)*SEC_R, APX_Y+Math.cos(sa)*SEC_R); ex.stroke(); ex.restore();
}

/* =========================================================
   8. TOGGLES
   ========================================================= */
let beamOn=true, xray=false;
const bBeam=document.getElementById('btnBeam'), bX=document.getElementById('btnXray'),
      bGhost=document.getElementById('btnGhost');
bBeam.onclick=()=>{ beamOn=!beamOn; bBeam.classList.toggle('on',beamOn); beamGroup.visible=beamOn; };
bX.onclick=()=>{ xray=!xray; bX.classList.toggle('on',xray); skelGroup.visible=xray; };
bGhost.onclick=()=>{ ghostAll=!ghostAll; bGhost.classList.toggle('on',ghostAll); };

/* ---- posture: dorsal recumbency (on the back, real-exam) vs lateral ---- */
const bPosture=document.getElementById('btnPosture');
function setPosture(p){
  posture=p;
  // π about the cranio-caudal (X) axis → belly faces up, probe approaches from above
  dog.rotation.x = (p==='dorsal') ? Math.PI : 0;
  bPosture.classList.toggle('on', p==='dorsal');
  bPosture.textContent = p==='dorsal' ? '🐕 שכיבה על הגב' : '🐕 שכיבה על הצד';
  goTo(cur); // re-frame camera for the new posture
}
bPosture.onclick=()=> setPosture(posture==='dorsal'?'lateral':'dorsal');

/* ---- Realistic CT anatomy (lazy-loaded GLB; segmented by tissue group) ---- */
const bCT=document.getElementById('btnCT');
let ctGroup=null, ctLoading=false, ctOn=false;
// tissue styling per source material name (model is grouped into 5 tissue families)
const CT_STYLE={
  default_lungs:               {color:0xe79bb0, opacity:.40},
  default:                     {color:0xe8ecf2, opacity:.30}, // skeleton
  default_blood:               {color:0xc0392b, opacity:.92}, // vessels
  default_intestines:          {color:0xc9a36a, opacity:.85},
  default_vascular_liver_pancreas:{color:0x9e5b3e, opacity:.9} // liver / pancreas group
};
// transform that aligns the GLB into scene space (tuned empirically).
// rz=π flips the model's native orientation to match scene axes
// (+X cranial, +Y dorsal, +Z left): lungs→cranial, spine→dorsal, intestines→caudal/ventral.
const CT_TF={ s:5.4, rx:0, ry:0, rz:Math.PI, px:-0.8, py:0.6, pz:0 };
function applyCTtransform(){
  if(!ctGroup) return;
  ctGroup.scale.setScalar(CT_TF.s);
  ctGroup.rotation.set(CT_TF.rx,CT_TF.ry,CT_TF.rz);
  ctGroup.position.set(CT_TF.px,CT_TF.py,CT_TF.pz);
}
window.CT_TF=CT_TF; window.applyCTtransform=applyCTtransform; // expose for tuning
function loadCT(){
  if(ctGroup||ctLoading) return;
  ctLoading=true; document.getElementById('load').style.display='flex';
  document.querySelector('#load p').textContent='טוען מודל CT אמיתי (39MB)…';
  new GLTFLoader().load('./dog-abdomen.glb',(g)=>{
    ctGroup=new THREE.Group();
    // center the loaded model on its own bbox so our transform is predictable
    const box=new THREE.Box3().setFromObject(g.scene);
    const c=box.getCenter(new THREE.Vector3());
    g.scene.position.sub(c);
    g.scene.traverse(o=>{ if(o.isMesh){
      const mn=(o.material&&o.material.name)||'default';
      o.userData.matName=mn;
      const st=CT_STYLE[mn]||{color:0xb08060,opacity:.85};
      o.material=new THREE.MeshStandardMaterial({color:st.color, roughness:.5, metalness:.05,
        transparent:true, opacity:st.opacity, side:THREE.DoubleSide, depthWrite:st.opacity>0.6});
    }});
    ctGroup.add(g.scene);
    applyCTtransform();
    dog.add(ctGroup);
    window.__ctGroup=ctGroup; window.__ctInner=g.scene;
    ctLoading=false; document.getElementById('load').style.display='none';
    setCT(true);
  }, undefined, (e)=>{
    ctLoading=false; document.getElementById('load').style.display='none';
    bCT.classList.remove('on'); alert('שגיאה בטעינת מודל ה-CT');
  });
}
function setCT(on){
  ctOn=on; bCT.classList.toggle('on',on);
  if(ctGroup) ctGroup.visible=on;
  // when CT anatomy is shown, hide the schematic organs/skeleton for a clean realistic view
  organsRoot.visible=!on;
  skelGroup.visible = on?false:xray;
  // dim the glass body further so the dense CT reads clearly
  glassMat.opacity = on?0.03:0.06;
  document.getElementById('ctCredit').style.display = on?'block':'none';
}
bCT.onclick=()=>{
  if(!ctGroup){ loadCT(); return; }
  setCT(!ctOn);
};

/* =========================================================
   9. QUIZ — "repeat the exam"
   ========================================================= */
const QUIZ = [
  {q:'מהו סדר הבדיקה השיטתי המקובל בבטן הכלב?',
   o:['אקראי, מה שנוח','שיטתי וקבוע (כבד→טחול→כליות→adrenals→GIT→שלפוחית→כלי דם)','רק האיבר החשוד','מהזנב לראש'],
   a:1, fb:'נכון — בדיקה שיטתית וקבועה מבטיחה שלא מפספסים איבר. מתחילים קרניאלית (כבד) ומסיימים כודלית/בכלי הדם.'},
  {q:'איזה איבר הוא ההיפר-אקואי (הבהיר) ביותר בבטן התקינה?',
   o:['כבד','cortex של הכליה','טחול','שריר'],
   a:2, fb:'נכון — סדר האקוגניות: טחול > כבד > cortex כליה. הטחול הוא ה"קו הבהיר" בבטן השמאלית.'},
  {q:'מהו עובי הדופן התקין של שלפוחית שתן מלאה?',
   o:['<1–2 מ״מ','5–7 מ״מ','1 ס״מ','לא ניתן למדידה'],
   a:0, fb:'נכון — דופן <1–2 מ״מ במצב מלא. עיבוי קדמי-ונטרלי מחשיד cystitis, ומסה ב-trigone מחשידה TCC.'},
  {q:'כיצד מבדילים את אבי העורקים מהווריד הנבוב הכודלי (CVC)?',
   o:['לפי הצבע','אבי העורקים פועם ודופן עבה, CVC מתמוטט עם הנשימה','הם זהים','לפי הגודל בלבד'],
   a:1, fb:'נכון — אבי העורקים עגול, פועם, דופן עבה; ה-CVC אליפסי ומתמוטט עם הנשימה (ומתרחב בגודש ימני).'},
  {q:'איך מאתרים את בלוטות יותרת הכליה (adrenals)?',
   o:['מתחת לשלפוחית','על-ידי מעקב אחר אבי העורקים וה-CVC, מדיאלית לכליות','בתוך הכבד','ליד הטחול'],
   a:1, fb:'נכון — ה-adrenals שוכנות מדיאלית לכליות צמוד לכלי הדם הגדולים. עוקבים את האאורטה/CVC כ-landmark.'},
  {q:'כמה שכבות מזהים בדופן מעי תקין, וכיצד נראה החתך הרוחבי?',
   o:['3 שכבות, חתך משולש','5 שכבות, תבנית "גלגל" (wagon wheel)','שכבה אחת אחידה','7 שכבות'],
   a:1, fb:'נכון — 5 שכבות מתחלפות; בחתך רוחבי מתקבלת תבנית "גלגל". אובדן שכבתיות מחשיד גידול/דלקת.'},
  {q:'מהו עובי הקוטב הכודלי התקין של בלוטת יותרת הכליה בכלב?',
   o:['<7.4 מ״מ','1.5 ס״מ','3 ס״מ','אין ערך ייחוס'],
   a:0, fb:'נכון — עובי קוטב כודלי <7.4 מ״מ. הגדלה דו-צדדית מחשידה Cushing, ופלישה ל-CVC מחשידה ממאירות.'},
  {q:'איזה ממצא בלבלב מחשיד pancreatitis חריף?',
   o:['לבלב דק והיפר-אקואי','לבלב מעובה היפו-אקואי + שומן סובב היפר-אקואי + נוזל מקומי','כיס מרה מלא','כליה מוגדלת'],
   a:1, fb:'נכון — בדלקת חריפה הלבלב מתעבה ומחשיך, השומן הסובב נעשה בהיר (היפר-אקואי), ולעיתים נוזל חופשי מקומי.'},
];
const quizEl=document.getElementById('quiz'), quizCard=document.getElementById('quizCard');
document.getElementById('btnQuiz').onclick=openQuiz;
function openQuiz(){
  let answered=0, correct=0;
  quizCard.innerHTML = `<h2>🎓 חזור על הבדיקה</h2>
    <div class="qsub">ענה על ${QUIZ.length} השאלות כדי לוודא שאתה יכול לבצע בדיקת בטן מלאה בעצמך · Self-check before you scan</div>
    <div id="qlist"></div>
    <div class="score" id="qscore" style="display:none"></div>
    <button class="close" id="qclose">סגור וחזור להדמיה</button>`;
  const list=quizCard.querySelector('#qlist');
  QUIZ.forEach((item,qi)=>{
    const qd=document.createElement('div'); qd.className='q';
    qd.innerHTML=`<div class="qt">${qi+1}. ${item.q}</div>`;
    item.o.forEach((opt,oi)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=()=>{
        if(qd.dataset.done) return; qd.dataset.done='1'; answered++;
        if(oi===item.a){ b.classList.add('correct'); correct++; }
        else { b.classList.add('wrong'); qd.querySelectorAll('.opt')[item.a].classList.add('correct'); }
        const fb=qd.querySelector('.feedback'); fb.style.display='block'; fb.textContent=item.fb;
        if(answered===QUIZ.length){
          const sc=quizCard.querySelector('#qscore'); sc.style.display='block';
          sc.innerHTML=`ציון: <b>${correct}/${QUIZ.length}</b> · ${correct===QUIZ.length?'מצוין! אתה מוכן לסרוק 🐾':'כדאי לחזור על האיברים שטעית בהם'}`;
        }
      };
      qd.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='feedback'; qd.appendChild(fb);
    list.appendChild(qd);
  });
  quizCard.querySelector('#qclose').onclick=()=>quizEl.style.display='none';
  quizEl.style.display='flex';
}

/* =========================================================
   10. RENDER LOOP
   ========================================================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if(tween) tween(performance.now());

  applyFade();

  // LIVE exam feel — micro-fanning of the probe
  if(!tween){
    probe.rotation.z = probeBase.z + Math.sin(t*1.25)*0.02;
    probe.rotation.x = probeBase.x + Math.sin(t*0.85+1.3)*0.015;
    probe.position.y += Math.sin(t*2.1)*0.0006;
  }
  // beam scan-line sweep
  if(beamOn){
    const half=THREE.MathUtils.degToRad(SECTOR_DEG/2);
    const a = Math.sin(t*3)*half;
    scanLine.position.x = Math.sin(a)*SECTOR_LEN/2;
    scanLine.rotation.z = a;
    beamMat.opacity = 0.12 + 0.04*Math.sin(t*4);
  }
  // gentle breathing
  bodyGroup.scale.y = 1 + Math.sin(t*0.6)*0.008;
  organsRoot.position.y = Math.sin(t*0.6)*0.02;

  controls.update();
  renderer.render(scene, camera);
  drawEcho(t);
}

/* init */
setMode('full');
setPosture('dorsal');   // default to real-exam posture (on the back)
goTo(0);
animate();
document.getElementById('load').style.display='none';

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown',e=>{
  if(mode==='single') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(cur-1);
});
</script>
